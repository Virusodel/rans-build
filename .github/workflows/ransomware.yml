name: Build DBT MBR Protector Suite

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Visual Studio
      uses: microsoft/setup-msbuild@v2
      with:
        vs-version: '17.0'
        
    - name: Install Windows SDK & WDK
      shell: pwsh
      run: |
        choco install windows-sdk-10-version-2004-windbg -y
        
        $ntddk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -Recurse -Filter "ntddk.h" | Select-Object -First 1
        if ($ntddk) {
          $version = $ntddk.Directory.Parent.Name
          Write-Host "Using WDK Version: $version"
          echo "WDK_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
        } else {
          Write-Host "ntddk.h not found!"
          exit 1
        }
        
    - name: Verify Source Files
      shell: pwsh
      run: |
        $files = @(
          "scr\dbt_mbr_protector.c",
          "scr\dbt_mbr_protector.inf",
          "notifier\dbt_notifier.cpp"
        )
        
        foreach ($file in $files) {
          if (Test-Path $file) {
            Write-Host "$file found"
          } else {
            Write-Host "$file MISSING"
            exit 1
          }
        }
        
    - name: Build Kernel Driver (x64 and x86)
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
        
        powershell -Command "$files = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\build\*\WindowsDriver.Common.targets'; foreach($f in $files) { (Get-Content $f.FullName -Raw) -replace \"'x86'\", \"'xx86'\" | Set-Content $f.FullName -NoNewline }"
        
        mkdir scr\obj\x64 2>nul
        mkdir scr\obj\x86 2>nul
        
        msbuild dbt_mbr_protector.vcxproj /p:Configuration=Release /p:Platform=x64 /p:TargetVersion=Windows10 /p:SignMode=Off
        
        msbuild dbt_mbr_protector.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:TargetVersion=Windows10 /p:SignMode=Off
        
        if exist "x64\Release\dbt_mbr_protector\dbt_mbr_protector.sys" (
          copy "x64\Release\dbt_mbr_protector\dbt_mbr_protector.sys" "scr\obj\x64\"
          copy "x64\Release\dbt_mbr_protector\dbt_mbr_protector.pdb" "scr\obj\x64\"
        ) else if exist "x64\Release\dbt_mbr_protector.sys" (
          copy "x64\Release\dbt_mbr_protector.sys" "scr\obj\x64\"
          copy "x64\Release\dbt_mbr_protector.pdb" "scr\obj\x64\"
        ) else (
          echo ERROR: x64 driver not found!
          exit /b 1
        )
        
        if exist "Win32\Release\dbt_mbr_protector\dbt_mbr_protector.sys" (
          copy "Win32\Release\dbt_mbr_protector\dbt_mbr_protector.sys" "scr\obj\x86\"
          copy "Win32\Release\dbt_mbr_protector\dbt_mbr_protector.pdb" "scr\obj\x86\"
        ) else if exist "Win32\Release\dbt_mbr_protector.sys" (
          copy "Win32\Release\dbt_mbr_protector.sys" "scr\obj\x86\"
          copy "Win32\Release\dbt_mbr_protector.pdb" "scr\obj\x86\"
        ) else if exist "Release\dbt_mbr_protector\dbt_mbr_protector.sys" (
          copy "Release\dbt_mbr_protector\dbt_mbr_protector.sys" "scr\obj\x86\"
          copy "Release\dbt_mbr_protector\dbt_mbr_protector.pdb" "scr\obj\x86\"
        ) else if exist "Release\dbt_mbr_protector.sys" (
          copy "Release\dbt_mbr_protector.sys" "scr\obj\x86\"
          copy "Release\dbt_mbr_protector.pdb" "scr\obj\x86\"
        ) else (
          echo ERROR: x86 driver not found!
          exit /b 1
        )
        
        copy scr\dbt_mbr_protector.inf scr\obj\
        
        echo Driver builds complete!
        
    - name: Build Notifier (Universal x86)
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x86
        
        mkdir notifier\obj 2>nul
        
        cl /c /Zi /W4 /O2 /DNDEBUG /EHsc ^
          /I"C:\Program Files (x86)\Windows Kits\10\Include\%WDK_VERSION%\um" ^
          /D_X86_ ^
          notifier\dbt_notifier.cpp ^
          /Fonotifier\obj\dbt_notifier.obj
        
        if not exist notifier\obj\dbt_notifier.obj (
          echo ERROR: Notifier compilation failed!
          exit /b 1
        )
        
        link /MACHINE:X86 /OUT:notifier\obj\dbt_notifier.exe /SUBSYSTEM:WINDOWS ^
          /LIBPATH:"C:\Program Files (x86)\Windows Kits\10\Lib\%WDK_VERSION%\um\x86" ^
          notifier\obj\dbt_notifier.obj ^
          user32.lib kernel32.lib psapi.lib shlwapi.lib advapi32.lib
        
        echo Universal Notifier build complete!
        
    - name: Sign Drivers
      shell: pwsh
      run: |
        $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits" -Recurse -Filter "signtool.exe" | Select-Object -First 1
        
        if ($signtool) {
          Write-Host "Generating self-signed test root certificate..."
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=DBT Test Root" `
            -KeyUsage DigitalSignature -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @("2.5.29.19={text}CA=true")
          
          if (Test-Path "scr\obj\x64\dbt_mbr_protector.sys") {
            Write-Host "Signing x64 driver..."
            & $signtool.FullName sign /v /fd SHA256 /a /s My /n "CN=DBT Test Root" /t http://timestamp.digicert.com "scr\obj\x64\dbt_mbr_protector.sys"
          }
          
          if (Test-Path "scr\obj\x86\dbt_mbr_protector.sys") {
            Write-Host "Signing x86 driver..."
            & $signtool.FullName sign /v /fd SHA256 /a /s My /n "CN=DBT Test Root" /t http://timestamp.digicert.com "scr\obj\x86\dbt_mbr_protector.sys"
          }
          
          Write-Host "Signing complete!"
        } else {
          Write-Host "WARNING: signtool not found, drivers will be unsigned"
        }
        
    - name: Create Installation Packages
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path artifacts_x64
        New-Item -ItemType Directory -Force -Path artifacts_x86
        
        Copy-Item "scr\obj\x64\dbt_mbr_protector.sys" "artifacts_x64\" -ErrorAction SilentlyContinue
        Copy-Item "scr\obj\x64\dbt_mbr_protector.pdb" "artifacts_x64\" -ErrorAction SilentlyContinue
        Copy-Item "scr\obj\dbt_mbr_protector.inf" "artifacts_x64\" -ErrorAction SilentlyContinue
        Copy-Item "notifier\obj\dbt_notifier.exe" "artifacts_x64\" -ErrorAction SilentlyContinue
        
        Copy-Item "scr\obj\x86\dbt_mbr_protector.sys" "artifacts_x86\" -ErrorAction SilentlyContinue
        Copy-Item "scr\obj\x86\dbt_mbr_protector.pdb" "artifacts_x86\" -ErrorAction SilentlyContinue
        Copy-Item "scr\obj\dbt_mbr_protector.inf" "artifacts_x86\" -ErrorAction SilentlyContinue
        Copy-Item "notifier\obj\dbt_notifier.exe" "artifacts_x86\" -ErrorAction SilentlyContinue
        
        $installBat = @"
        @echo off
        title DBT MBR Protector Installer
        echo ========================================
        echo  DBT MBR Protector - Installation
        echo ========================================
        echo.
        
        net session >nul 2>&1
        if %errorLevel% neq 0 (
          echo ERROR: Administrator privileges required!
          echo Please run as Administrator.
          pause
          exit /b 1
        )
        
        echo [1/5] Enabling test signing mode...
        bcdedit /set testsigning on >nul 2>&1
        
        echo [2/5] Copying driver...
        copy /Y dbt_mbr_protector.sys C:\Windows\System32\drivers\
        if %errorLevel% neq 0 (
          echo ERROR: Failed to copy driver!
          pause
          exit /b 1
        )
        
        echo [3/5] Installing service...
        sc create DbtMbrProtector binPath= "C:\Windows\System32\drivers\dbt_mbr_protector.sys" type= kernel start= boot
        
        echo [4/5] Starting driver...
        sc start DbtMbrProtector
        
        echo [5/5] Installing notifier...
        mkdir "C:\Program Files\DBT" 2>nul
        copy /Y dbt_notifier.exe "C:\Program Files\DBT\"
        start "" "C:\Program Files\DBT\dbt_notifier.exe"
        
        echo.
        echo ========================================
        echo  Installation complete!
        echo ========================================
        echo.
        echo  Please restart your computer for changes to take effect.
        echo.
        echo  To test: echo test > \\.\PhysicalDrive0
        echo.
        pause
        "@
        
        $installBat | Out-File -FilePath artifacts_x64\install.bat -Encoding ASCII
        $installBat | Out-File -FilePath artifacts_x86\install.bat -Encoding ASCII
        
        $uninstallBat = @"
        @echo off
        title DBT MBR Protector Uninstaller
        echo ========================================
        echo  DBT MBR Protector - Uninstallation
        echo ========================================
        echo.
        
        net session >nul 2>&1
        if %errorLevel% neq 0 (
          echo ERROR: Administrator privileges required!
          echo Please run as Administrator.
          pause
          exit /b 1
        )
        
        echo [1/4] Stopping notifier...
        taskkill /F /IM dbt_notifier.exe 2>nul
        
        echo [2/4] Stopping driver...
        sc stop DbtMbrProtector 2>nul
        
        echo [3/4] Removing service...
        sc delete DbtMbrProtector 2>nul
        
        echo [4/4] Deleting files...
        del /F C:\Windows\System32\drivers\dbt_mbr_protector.sys 2>nul
        rmdir /S /Q "C:\Program Files\DBT" 2>nul
        
        echo.
        echo ========================================
        echo  Uninstallation complete!
        echo ========================================
        echo.
        pause
        "@
        
        $uninstallBat | Out-File -FilePath artifacts_x64\uninstall.bat -Encoding ASCII
        $uninstallBat | Out-File -FilePath artifacts_x86\uninstall.bat -Encoding ASCII
        
        $readme = @"
        DBT MBR PROTECTOR - INSTALLATION GUIDE
        ======================================
        
        FILES:
        ------
        dbt_mbr_protector.sys  : Kernel-mode filter driver
        dbt_mbr_protector.inf  : Driver installation file
        dbt_notifier.exe       : User-mode notification service (Universal x86)
        install.bat            : Automated installation script
        uninstall.bat          : Automated removal script
        
        INSTALLATION:
        -------------
        1. Run install.bat as Administrator
        2. Restart the computer
        3. The protection is now active
        
        TESTING:
        --------
        To verify the driver works:
        - Run as Administrator: echo test > \\.\PhysicalDrive0
        - You should see "Access denied"
        - Notifier will show a warning message
        
        REQUIREMENTS:
        -------------
        - Windows 7/8/10/11 (x64 or x86)
        - Administrator privileges
        - Test signing mode (enabled by installer)
        
        UNINSTALL:
        ----------
        Run uninstall.bat as Administrator
        
        NOTES:
        ------
        - The driver protects MBR (sector 0) from any write attempts
        - All blocked attempts are logged to Windows event log
        - Notifier runs in background and shows alerts
        - Requires reboot after installation
        "@
        
        $readme | Out-File -FilePath artifacts_x64\README.txt -Encoding ASCII
        $readme | Out-File -FilePath artifacts_x86\README.txt -Encoding ASCII
        
    - name: Upload x64 Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dbt-mbr-protector-suite-x64
        path: artifacts_x64\*
        retention-days: 30
        
    - name: Upload x86 Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dbt-mbr-protector-suite-x86
        path: artifacts_x86\*
        retention-days: 30
        
    - name: Create x64 Release Package
      if: github.ref == 'refs/heads/main'
      shell: pwsh
      run: |
        $version = Get-Date -Format "yyyy.MM.dd.HHmm"
        $zipFile = "dbt-mbr-protector-x64-$version.zip"
        Compress-Archive -Path artifacts_x64\* -DestinationPath $zipFile -Force
        echo "ZIP_FILE_X64=$zipFile" | Out-File -FilePath $env:GITHUB_ENV -Append
        
    - name: Create x86 Release Package
      if: github.ref == 'refs/heads/main'
      shell: pwsh
      run: |
        $version = Get-Date -Format "yyyy.MM.dd.HHmm"
        $zipFile = "dbt-mbr-protector-x86-$version.zip"
        Compress-Archive -Path artifacts_x86\* -DestinationPath $zipFile -Force
        echo "ZIP_FILE_X86=$zipFile" | Out-File -FilePath $env:GITHUB_ENV -Append
        
    - name: Upload x64 Release Package
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: release-package-x64
        path: ${{ env.ZIP_FILE_X64 }}
        
    - name: Upload x86 Release Package
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: release-package-x86
        path: ${{ env.ZIP_FILE_X86 }}
