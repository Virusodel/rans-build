name: Build DBT MBR Protector Driver

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  SOLUTION_PATH: src
  DRIVER_NAME: dbt_mbr_protector

jobs:
  build:
    runs-on: windows-2022
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Visual Studio environment
      uses: microsoft/setup-msbuild@v2  # Актуальная версия
      with:
        vs-version: '17.0'
        
    - name: Setup WDK
      shell: pwsh
      run: |
        choco install windows-sdk-10-version-2004-windbg -y
        choco install windows-driver-kit -y
        echo "WDKPATH=C:\Program Files (x86)\Windows Kits\10" >> $env:GITHUB_ENV
        
    - name: Build driver
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
        call "C:\Program Files (x86)\Windows Kits\10\bin\10.0.19041.0\setenv.bat" /x64 /fre /build
        cd src
        build -cZ
        
    - name: Sign driver (test certificate)
      shell: pwsh
      run: |
        $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=DBT Test Root" `
          -KeyUsage DigitalSignature -CertStoreLocation Cert:\CurrentUser\My `
          -TextExtension @("2.5.29.19={text}CA=true")
        & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.19041.0\x64\signtool.exe" sign `
          /v /fd SHA256 /a /s My /n "DBT Test Root" `
          /t http://timestamp.digicert.com `
          src\obj\*.sys
        
    - name: Create INF with signed driver
      shell: pwsh
      run: |
        Copy-Item src\dbt_mbr_protector.inf src\obj\ -Force
        Copy-Item src\obj\*.sys src\obj\dbt_mbr_protector.sys -Force
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dbt-mbr-protector
        path: |
          src\obj\*.sys
          src\obj\*.inf
          src\obj\*.cat
        retention-days: 30
        
    - name: Create release package
      if: github.ref == 'refs/heads/main'
      shell: pwsh
      run: |
        $version = (Get-Date).ToString('yyyy.MM.dd.HHmm')
        Compress-Archive -Path src\obj\* -DestinationPath "dbt-mbr-protector-$version.zip"
        echo "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
        
    - name: Upload release asset
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: release-package
        path: dbt-mbr-protector-*.zip
