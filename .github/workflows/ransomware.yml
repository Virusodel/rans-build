name: Build WinLocker Builder v2.0

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Setup .NET Framework
      run: |
        echo "Setting up .NET Framework..."
        # .NET Framework уже установлен на windows-latest
    
    - name: Restore NuGet packages
      run: |
        dotnet restore WinLockerBuilder.csproj --runtime win-x86
    
    - name: Build WinLocker Builder
      run: |
        msbuild WinLockerBuilder.csproj /p:Configuration=Release /p:Platform="Any CPU" /p:TargetFramework=net48
        
        # Проверяем результат сборки
        if (Test-Path "bin\Any CPU\Release\net48\WinLockerBuilder.exe") {
          Write-Host "=== Build SUCCESS ===" -ForegroundColor Green
          Get-ChildItem "bin\Any CPU\Release\net48\WinLockerBuilder.exe" | Format-Table -AutoSize
          Copy-Item "bin\Any CPU\Release\net48\WinLockerBuilder.exe" "WinLockerBuilder_v2.exe"
        } else {
          Write-Host "=== Build FAILED ===" -ForegroundColor Red
          exit 1
        }
    
    - name: Upload Builder EXE
      uses: actions/upload-artifact@v4
      with:
        name: WinLockerBuilder_v2
        path: WinLockerBuilder_v2.exe
    
    - name: Upload Debug Info
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          **/*.log
          **/*.xml
          **/bin/
          **/obj/
