name: Build DBT MBR Protector Suite

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Visual Studio
      uses: microsoft/setup-msbuild@v2
      with:
        vs-version: '17.0'
        
    - name: Install Windows SDK (only)
      shell: pwsh
      run: |
        # Установка только SDK (WDK уже есть в образе)
        choco install windows-sdk-10-version-2004-windbg -y
        
        # Проверка наличия ntddk.h
        $ntddk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -Recurse -Filter "ntddk.h" | Select-Object -First 1
        if ($ntddk) {
          Write-Host "Found ntddk.h at: $($ntddk.Directory.FullName)"
          $version = $ntddk.Directory.Parent.Name
          Write-Host "WDK Version: $version"
          echo "WDK_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
        } else {
          Write-Host "ntddk.h not found!"
          exit 1
        }
        
    - name: Verify Source Files
      shell: pwsh
      run: |
        $files = @(
          "scr\dbt_mbr_protector.c",
          "scr\dbt_mbr_protector.inf",
          "notifier\dbt_notifier.cpp"
        )
        
        foreach ($file in $files) {
          if (Test-Path $file) {
            Write-Host "$file found"
          } else {
            Write-Host "$file MISSING"
            exit 1
          }
        }
        
    - name: Build Kernel Driver
      shell: cmd
      run: |
        :: Настройка окружения
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
        
        :: Создание директории
        mkdir scr\obj 2>nul
        
        :: Компиляция драйвера (используем найденную версию WDK)
        cl /c /Zi /GS- /W4 /O2 /DNDEBUG ^
          /I"C:\Program Files (x86)\Windows Kits\10\Include\%WDK_VERSION%\km" ^
          /I"C:\Program Files (x86)\Windows Kits\10\Include\%WDK_VERSION%\shared" ^
          /I"C:\Program Files (x86)\Windows Kits\10\Include\%WDK_VERSION%\um" ^
          /I"C:\Program Files (x86)\Windows Kits\10\Include\%WDK_VERSION%\winrt" ^
          /I"C:\Program Files (x86)\Windows Kits\10\Include\%WDK_VERSION%\ucrt" ^
          /D_WIN32_WINNT=0x0A00 ^
          /DWINVER=0x0A00 ^
          /D_WIN64 ^
          /DAMD64 ^
          /DNTDDI_VERSION=0x0A000007 ^
          scr\dbt_mbr_protector.c ^
          /Foscr\obj\dbt_mbr_protector.obj
        
        :: Проверка компиляции
        if not exist scr\obj\dbt_mbr_protector.obj (
          echo ERROR: Compilation failed!
          exit /b 1
        )
        
        :: Линковка драйвера
        link /MACHINE:X64 /DRIVER /OUT:scr\obj\dbt_mbr_protector.sys ^
          /LIBPATH:"C:\Program Files (x86)\Windows Kits\10\Lib\%WDK_VERSION%\km\x64" ^
          /LIBPATH:"C:\Program Files (x86)\Windows Kits\10\Lib\%WDK_VERSION%\ucrt\x64" ^
          scr\obj\dbt_mbr_protector.obj ^
          ntoskrnl.lib hal.lib
        
        :: Проверка линковки
        if not exist scr\obj\dbt_mbr_protector.sys (
          echo ERROR: Linking failed!
          exit /b 1
        )
        
        :: Копирование INF
        copy scr\dbt_mbr_protector.inf scr\obj\
        
        echo Driver build complete!
        
    - name: Build Notifier
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
        
        mkdir notifier\obj 2>nul
        
        :: Компиляция notifier
        cl /c /Zi /W4 /O2 /DNDEBUG /EHsc ^
          /I"C:\Program Files (x86)\Windows Kits\10\Include\%WDK_VERSION%\um" ^
          notifier\dbt_notifier.cpp ^
          /Fonotifier\obj\dbt_notifier.obj
        
        :: Проверка компиляции
        if not exist notifier\obj\dbt_notifier.obj (
          echo ERROR: Notifier compilation failed!
          exit /b 1
        )
        
        :: Линковка notifier
        link /MACHINE:X64 /OUT:notifier\obj\dbt_notifier.exe /SUBSYSTEM:WINDOWS ^
          /LIBPATH:"C:\Program Files (x86)\Windows Kits\10\Lib\%WDK_VERSION%\um\x64" ^
          notifier\obj\dbt_notifier.obj ^
          user32.lib kernel32.lib psapi.lib shlwapi.lib advapi32.lib
        
        echo Notifier build complete!
        
    - name: Sign Driver
      shell: pwsh
      run: |
        $sysPath = "scr\obj\dbt_mbr_protector.sys"
        
        if (-not (Test-Path $sysPath)) {
          Write-Host "ERROR: Driver not found for signing!"
          exit 1
        }
        
        # Создание сертификата
        $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=DBT Test Root" `
          -KeyUsage DigitalSignature -CertStoreLocation Cert:\CurrentUser\My `
          -TextExtension @("2.5.29.19={text}CA=true")
        
        # Поиск signtool
        $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits" -Recurse -Filter "signtool.exe" | Select-Object -First 1
        
        if ($signtool) {
          Write-Host "Signing driver with $($signtool.FullName)..."
          & $signtool.FullName sign /v /fd SHA256 /a /s My /n "DBT Test Root" /t http://timestamp.digicert.com $sysPath
          
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Driver signed successfully!"
          } else {
            Write-Host "Signing failed with code $LASTEXITCODE"
          }
        } else {
          Write-Host "WARNING: signtool not found, driver will be unsigned"
        }
        
    - name: Create Installation Package
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path artifacts
        
        # Копирование файлов
        $files = @(
          "scr\obj\dbt_mbr_protector.sys",
          "scr\obj\dbt_mbr_protector.inf",
          "scr\obj\dbt_mbr_protector.pdb",
          "notifier\obj\dbt_notifier.exe"
        )
        
        foreach ($file in $files) {
          if (Test-Path $file) {
            Copy-Item $file artifacts\
            Write-Host "Copied $file"
          } else {
            Write-Host "WARNING: $file not found"
          }
        }
        
        # Создание install.bat
        @"
        @echo off
        title DBT MBR Protector Installer
        echo ========================================
        echo  DBT MBR Protector - Installation
        echo ========================================
        echo.
        
        :: Проверка прав
        net session >nul 2>&1
        if %errorLevel% neq 0 (
          echo ERROR: Administrator privileges required!
          echo Please run as Administrator.
          pause
          exit /b 1
        )
        
        echo [1/5] Enabling test signing mode...
        bcdedit /set testsigning on >nul 2>&1
        
        echo [2/5] Copying driver...
        copy /Y dbt_mbr_protector.sys C:\Windows\System32\drivers\
        if %errorLevel% neq 0 (
          echo ERROR: Failed to copy driver!
          pause
          exit /b 1
        )
        
        echo [3/5] Installing service...
        sc create DbtMbrProtector binPath= "C:\Windows\System32\drivers\dbt_mbr_protector.sys" type= kernel start= boot
        
        echo [4/5] Starting driver...
        sc start DbtMbrProtector
        
        echo [5/5] Installing notifier...
        mkdir "C:\Program Files\DBT" 2>nul
        copy /Y dbt_notifier.exe "C:\Program Files\DBT\"
        start "" "C:\Program Files\DBT\dbt_notifier.exe"
        
        echo.
        echo ========================================
        echo  Installation complete!
        echo ========================================
        echo.
        echo  Please restart your computer for changes to take effect.
        echo.
        echo  To test: echo test > \\.\PhysicalDrive0
        echo.
        pause
        "@ | Out-File -FilePath artifacts\install.bat -Encoding ASCII
        
        # Создание uninstall.bat
        @"
        @echo off
        title DBT MBR Protector Uninstaller
        echo ========================================
        echo  DBT MBR Protector - Uninstallation
        echo ========================================
        echo.
        
        :: Проверка прав
        net session >nul 2>&1
        if %errorLevel% neq 0 (
          echo ERROR: Administrator privileges required!
          echo Please run as Administrator.
          pause
          exit /b 1
        )
        
        echo [1/4] Stopping notifier...
        taskkill /F /IM dbt_notifier.exe 2>nul
        
        echo [2/4] Stopping driver...
        sc stop DbtMbrProtector 2>nul
        
        echo [3/4] Removing service...
        sc delete DbtMbrProtector 2>nul
        
        echo [4/4] Deleting files...
        del /F C:\Windows\System32\drivers\dbt_mbr_protector.sys 2>nul
        rmdir /S /Q "C:\Program Files\DBT" 2>nul
        
        echo.
        echo ========================================
        echo  Uninstallation complete!
        echo ========================================
        echo.
        pause
        "@ | Out-File -FilePath artifacts\uninstall.bat -Encoding ASCII
        
        # Создание README
        @"
        DBT MBR PROTECTOR - INSTALLATION GUIDE
        ======================================
        
        FILES:
        ------
        dbt_mbr_protector.sys  : Kernel-mode filter driver
        dbt_mbr_protector.inf  : Driver installation file
        dbt_notifier.exe       : User-mode notification service
        install.bat            : Automated installation script
        uninstall.bat          : Automated removal script
        
        INSTALLATION:
        -------------
        1. Run install.bat as Administrator
        2. Restart the computer
        3. The protection is now active
        
        TESTING:
        --------
        To verify the driver works:
        - Run as Administrator: echo test > \\.\PhysicalDrive0
        - You should see "Access denied"
        - Notifier will show a warning message
        
        REQUIREMENTS:
        -------------
        - Windows 7/8/10/11 (x64)
        - Administrator privileges
        - Test signing mode (enabled by installer)
        
        UNINSTALL:
        ----------
        Run uninstall.bat as Administrator
        
        NOTES:
        ------
        - The driver protects MBR (sector 0) from any write attempts
        - All blocked attempts are logged to Windows event log
        - Notifier runs in background and shows alerts
        - Requires reboot after installation
        "@ | Out-File -FilePath artifacts\README.txt -Encoding ASCII
        
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dbt-mbr-protector-suite
        path: artifacts\*
        retention-days: 30
        
    - name: Create Release Package
      if: github.ref == 'refs/heads/main'
      shell: pwsh
      run: |
        $version = Get-Date -Format "yyyy.MM.dd.HHmm"
        $zipFile = "dbt-mbr-protector-$version.zip"
        Compress-Archive -Path artifacts\* -DestinationPath $zipFile -Force
        echo "ZIP_FILE=$zipFile" | Out-File -FilePath $env:GITHUB_ENV -Append
        
    - name: Upload Release Package
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: release-package
        path: ${{ env.ZIP_FILE }}
