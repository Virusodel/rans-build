name: Build DBT MBR Protector Suite

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022
    
    strategy:
      matrix:
        arch: [x64, x86, arm64]
        include:
          - arch: x64
            msvc_arch: x64
            wdk_arch: x64
            machine: X64
            def_arch: _AMD64_
            win_bits: _WIN64
          - arch: x86
            msvc_arch: x86
            wdk_arch: x86
            machine: X86
            def_arch: _X86_
            win_bits: _WIN32
          - arch: arm64
            msvc_arch: arm64
            wdk_arch: arm64
            machine: ARM64
            def_arch: _ARM64_
            win_bits: _WIN64
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Visual Studio
      uses: microsoft/setup-msbuild@v2
      with:
        vs-version: '17.0'
        
    - name: Install Windows SDK
      shell: pwsh
      run: |
        choco install windows-sdk-10-version-2004-windbg -y
        
        $ntddk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -Recurse -Filter "ntddk.h" | Select-Object -First 1
        if ($ntddk) {
          $version = $ntddk.Directory.Parent.Name
          Write-Host "Using WDK Version: $version"
          echo "WDK_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
        } else {
          Write-Host "ntddk.h not found!"
          exit 1
        }
        
    - name: Verify Source Files
      shell: pwsh
      run: |
        $files = @(
          "scr\dbt_mbr_protector.c",
          "scr\dbt_mbr_protector.inf",
          "notifier\dbt_notifier.cpp"
        )
        
        foreach ($file in $files) {
          if (Test-Path $file) {
            Write-Host "$file found"
          } else {
            Write-Host "$file MISSING"
            exit 1
          }
        }
        
    - name: Build Kernel Driver (${{ matrix.arch }})
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=${{ matrix.msvc_arch }}
        
        mkdir artifacts\${{ matrix.arch }} 2>nul
        
        set "WDK_INC=C:\Program Files (x86)\Windows Kits\10\Include\%WDK_VERSION%"
        set "WDK_LIB=C:\Program Files (x86)\Windows Kits\10\Lib\%WDK_VERSION%"
        
        cl /c /Zi /GS- /W4 /O2 /DNDEBUG ^
          /I"%WDK_INC%\km" ^
          /I"%WDK_INC%\shared" ^
          /I"%WDK_INC%\um" ^
          /D_WIN32_WINNT=0x0601 ^
          /DWINVER=0x0601 ^
          /DNTDDI_VERSION=0x06010000 ^
          /D${{ matrix.def_arch }} ^
          /D${{ matrix.win_bits }} ^
          /DDBT_MULTI_ARCH ^
          scr\dbt_mbr_protector.c ^
          /Foartifacts\${{ matrix.arch }}\dbt_mbr_protector.obj
        
        if not exist artifacts\${{ matrix.arch }}\dbt_mbr_protector.obj (
          echo ERROR: Compilation failed for ${{ matrix.arch }}!
          exit /b 1
        )
        
        set "WDK_LIBPATH=%WDK_LIB%\%wdk_arch%"
        
        link /MACHINE:${{ matrix.machine }} ^
          /DRIVER /ENTRY:DriverEntry /SUBSYSTEM:NATIVE ^
          /OUT:artifacts\${{ matrix.arch }}\dbt_mbr_protector.sys ^
          /LIBPATH:"%WDK_LIBPATH%\km" ^
          artifacts\${{ matrix.arch }}\dbt_mbr_protector.obj ^
          ntoskrnl.lib hal.lib
        
        if not exist artifacts\${{ matrix.arch }}\dbt_mbr_protector.sys (
          echo ERROR: Linking failed for ${{ matrix.arch }}!
          exit /b 1
        )
        
        copy scr\dbt_mbr_protector.inf artifacts\${{ matrix.arch }}\
        echo Driver build complete for ${{ matrix.arch }}!
        
    - name: Build Notifier (x64 only)
      if: matrix.arch == 'x64'
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
        
        mkdir artifacts\x64 2>nul
        
        cl /c /Zi /W4 /O2 /DNDEBUG /EHsc ^
          /I"C:\Program Files (x86)\Windows Kits\10\Include\%WDK_VERSION%\um" ^
          /D_AMD64_ ^
          /D_WIN64 ^
          notifier\dbt_notifier.cpp ^
          /Foartifacts\x64\dbt_notifier.obj
        
        if not exist artifacts\x64\dbt_notifier.obj (
          echo ERROR: Notifier compilation failed!
          exit /b 1
        )
        
        link /MACHINE:X64 /OUT:artifacts\x64\dbt_notifier.exe /SUBSYSTEM:WINDOWS ^
          /LIBPATH:"C:\Program Files (x86)\Windows Kits\10\Lib\%WDK_VERSION%\um\x64" ^
          artifacts\x64\dbt_notifier.obj ^
          user32.lib kernel32.lib psapi.lib shlwapi.lib advapi32.lib
        
        echo Notifier build complete!
        
    - name: Sign Driver (${{ matrix.arch }})
      shell: pwsh
      run: |
        $sysPath = "artifacts\${{ matrix.arch }}\dbt_mbr_protector.sys"
        
        if (-not (Test-Path $sysPath)) {
          Write-Host "ERROR: Driver not found for signing!"
          exit 1
        }
        
        $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=DBT Test Root" `
          -KeyUsage DigitalSignature -CertStoreLocation Cert:\CurrentUser\My `
          -TextExtension @("2.5.29.19={text}CA=true")
        
        $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits" -Recurse -Filter "signtool.exe" | Select-Object -First 1
        
        if ($signtool) {
          Write-Host "Signing driver for ${{ matrix.arch }}..."
          & $signtool.FullName sign /v /fd SHA256 /a /s My /n "DBT Test Root" /t http://timestamp.digicert.com $sysPath
          
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Driver signed successfully for ${{ matrix.arch }}!"
          } else {
            Write-Host "Signing failed with code $LASTEXITCODE"
          }
        } else {
          Write-Host "WARNING: signtool not found, driver will be unsigned"
        }
        
    - name: Create Install Scripts (${{ matrix.arch }})
      shell: pwsh
      run: |
        $arch = "${{ matrix.arch }}"
        $dest = "artifacts\$arch"
        
        # Скопируем notifier в каждую папку (если есть)
        if (Test-Path "artifacts\x64\dbt_notifier.exe") {
          Copy-Item "artifacts\x64\dbt_notifier.exe" "$dest\" -Force -ErrorAction SilentlyContinue
        }
        
        $installBat = @"
        @echo off
        title DBT MBR Protector Installer ($arch)
        echo ============================================================
        echo  DBT MBR Protector - Installation ($arch)
        echo ============================================================
        echo.
        
        net session >nul 2>&1
        if %errorLevel% neq 0 (
          echo ERROR: Administrator privileges required!
          echo Please run as Administrator.
          pause
          exit /b 1
        )
        
        echo [1/6] Enabling test signing mode...
        bcdedit /set testsigning on >nul 2>&1
        
        echo [2/6] Checking architecture...
        if /i "%PROCESSOR_ARCHITECTURE%"=="AMD64" (
          echo Detected: x64
        ) else if /i "%PROCESSOR_ARCHITECTURE%"=="x86" (
          echo Detected: x86
        ) else if /i "%PROCESSOR_ARCHITECTURE%"=="ARM64" (
          echo Detected: ARM64
        ) else (
          echo WARNING: Unknown architecture!
        )
        
        echo [3/6] Copying driver...
        copy /Y dbt_mbr_protector.sys C:\Windows\System32\drivers\
        if %errorLevel% neq 0 (
          echo ERROR: Failed to copy driver!
          pause
          exit /b 1
        )
        
        echo [4/6] Installing service...
        sc create DbtMbrProtector binPath= "C:\Windows\System32\drivers\dbt_mbr_protector.sys" type= kernel start= boot
        
        echo [5/6] Starting driver...
        sc start DbtMbrProtector
        
        echo [6/6] Installing notifier...
        if exist dbt_notifier.exe (
          mkdir "C:\Program Files\DBT" 2>nul
          copy /Y dbt_notifier.exe "C:\Program Files\DBT\"
          start "" "C:\Program Files\DBT\dbt_notifier.exe"
        ) else (
          echo WARNING: Notifier not found, skipping
        )
        
        echo.
        echo ============================================================
        echo  Installation complete for $arch!
        echo ============================================================
        echo.
        echo  Please restart your computer for changes to take effect.
        echo.
        echo  To test: echo test > \\.\PhysicalDrive0
        echo.
        pause
        "@
        $installBat | Out-File -FilePath "$dest\install.bat" -Encoding ASCII
        
        $uninstallBat = @"
        @echo off
        title DBT MBR Protector Uninstaller
        echo ============================================================
        echo  DBT MBR Protector - Uninstallation
        echo ============================================================
        echo.
        
        net session >nul 2>&1
        if %errorLevel% neq 0 (
          echo ERROR: Administrator privileges required!
          echo Please run as Administrator.
          pause
          exit /b 1
        )
        
        echo [1/4] Stopping notifier...
        taskkill /F /IM dbt_notifier.exe 2>nul
        
        echo [2/4] Stopping driver...
        sc stop DbtMbrProtector 2>nul
        
        echo [3/4] Removing service...
        sc delete DbtMbrProtector 2>nul
        
        echo [4/4] Deleting files...
        del /F C:\Windows\System32\drivers\dbt_mbr_protector.sys 2>nul
        rmdir /S /Q "C:\Program Files\DBT" 2>nul
        
        echo.
        echo ============================================================
        echo  Uninstallation complete!
        echo ============================================================
        echo.
        pause
        "@
        $uninstallBat | Out-File -FilePath "$dest\uninstall.bat" -Encoding ASCII
        
        $readme = @"
        DBT MBR PROTECTOR - INSTALLATION GUIDE
        ============================================================
        
        ARCHITECTURE: $arch
        
        FILES:
        ------
        dbt_mbr_protector.sys  : Kernel-mode filter driver ($arch)
        dbt_mbr_protector.inf  : Driver installation file
        dbt_notifier.exe       : User-mode notification service (if present)
        install.bat            : Automated installation script
        uninstall.bat          : Automated removal script
        
        INSTALLATION:
        -------------
        1. Run install.bat as Administrator
        2. Restart the computer
        3. The protection is now active
        
        TESTING:
        --------
        To verify the driver works:
        - Run as Administrator: echo test > \\.\PhysicalDrive0
        - You should see "Access denied"
        - Notifier will show a warning message
        
        REQUIREMENTS:
        -------------
        - Windows 7/8/10/11 ($arch)
        - Administrator privileges
        - Test signing mode (enabled by installer)
        
        FEATURES:
        --------
        - Protects MBR (sector 0) and GPT headers (sectors 1-9)
        - Kernel-level blocking
        - Process detection
        - Bilingual interface (English/Russian)
        - Event logging
        
        UNINSTALL:
        ----------
        Run uninstall.bat as Administrator
        
        NOTES:
        ------
        - All blocked attempts are logged to Windows event log
        - Notifier runs in background and shows alerts
        - Requires reboot after installation
        "@
        $readme | Out-File -FilePath "$dest\README.txt" -Encoding ASCII
        
        Write-Host "Install scripts created for $arch"
        
    - name: Upload Combined Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dbt-mbr-protector-all-arch
        path: artifacts\*
        retention-days: 30
        
    - name: Create Release Package
      if: github.ref == 'refs/heads/main'
      shell: pwsh
      run: |
        $version = Get-Date -Format "yyyy.MM.dd.HHmm"
        $zipFile = "DBT_MBR_Protector_$version.zip"
        Compress-Archive -Path artifacts\* -DestinationPath $zipFile -Force
        echo "ZIP_FILE=$zipFile" | Out-File -FilePath $env:GITHUB_ENV -Append
        
    - name: Upload Release Package
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: release-package
        path: ${{ env.ZIP_FILE }}
