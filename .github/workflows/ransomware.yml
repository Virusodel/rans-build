name: Build Ransomware Builder v9.0 (MinGW)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    # ========== СКАЧИВАЕМ ПОЛНЫЙ MINGW ИЗ РЕЛИЗА ==========
    - name: Download MinGW
      run: |
        Write-Host "=== Downloading full MinGW from official release ==="
        $url = "https://github.com/brechtsanders/winlibs_mingw/releases/download/16.1.0posix-14.0.0-msvcrt-r4/winlibs-x86_64-posix-seh-gcc-16.1.0-mingw-w64msvcrt-14.0.0-r4.zip"
        $zipPath = "mingw.zip"
        
        Invoke-WebRequest -Uri $url -OutFile $zipPath
        
        if (Test-Path $zipPath) {
          $size = (Get-Item $zipPath).Length
          Write-Host "=== MinGW downloaded successfully ($([math]::Round($size/1MB, 2)) MB) ==="
        } else {
          Write-Host "=== MinGW download failed ==="
          exit 1
        }
    
    # ========== СБОРКА БИЛДЕРА (C#) ==========
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Restore NuGet packages
      run: |
        dotnet restore builder.csproj --runtime win-x86
    
    - name: Build Builder
      run: |
        msbuild builder.csproj /p:Configuration=Release /p:Platform="Any CPU"
        
        if (Test-Path "bin\Any CPU\Release\net48\builder.exe") {
          Write-Host "=== Build SUCCESS ==="
          Get-ChildItem "bin\Any CPU\Release\net48\builder.exe" | Format-Table -AutoSize
          Copy-Item "bin\Any CPU\Release\net48\builder.exe" "RansomwareBuilder_v9_MinGW.exe"
        } else {
          Write-Host "=== Build FAILED ==="
          exit 1
        }
    
    - name: Upload Builder EXE
      uses: actions/upload-artifact@v4
      with:
        name: RansomwareBuilder_v9_MinGW
        path: RansomwareBuilder_v9_MinGW.exe
