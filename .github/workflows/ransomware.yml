name: Build DBT MBR Protector (x86 with WDK)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Visual Studio
      uses: microsoft/setup-msbuild@v2
      with:
        vs-version: '17.0'
        
    - name: Install WDK for x86
      shell: pwsh
      run: |
        # Установка WDK (включая x86)
        choco install windows-sdk-10-version-2004-windbg -y
        choco install wdk -y --version=10.0.19041.0
        
        # Проверка наличия библиотек
        $libs = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Lib" -Recurse -Filter "ntoskrnl.lib"
        Write-Host "Found ntoskrnl.lib at:"
        $libs | ForEach-Object { Write-Host $_.FullName }
        
    - name: Build x86 Driver
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x86
        
        mkdir artifacts_x86 2>nul
        
        :: Пути к WDK
        set WDK_VERSION=10.0.19041.0
        set WDK_INC=C:\Program Files (x86)\Windows Kits\10\Include\%WDK_VERSION%
        set WDK_LIB=C:\Program Files (x86)\Windows Kits\10\Lib\%WDK_VERSION%
        
        :: Компиляция
        cl /c /Zi /GS- /W4 /O2 /DNDEBUG ^
          /I"%WDK_INC%\km" ^
          /I"%WDK_INC%\shared" ^
          /I"%WDK_INC%\um" ^
          /D_X86_ ^
          /D_WIN32 ^
          /D_WIN32_WINNT=0x0601 ^
          /DWINVER=0x0601 ^
          /DNTDDI_VERSION=0x06010000 ^
          scr\dbt_mbr_protector.c ^
          /Foartifacts_x86\dbt_mbr_protector.obj
        
        if not exist artifacts_x86\dbt_mbr_protector.obj (
          echo ERROR: x86 Compilation failed!
          exit /b 1
        )
        
        :: Линковка
        link /MACHINE:X86 /DRIVER /ENTRY:DriverEntry /SUBSYSTEM:NATIVE /OUT:artifacts_x86\dbt_mbr_protector.sys ^
          /LIBPATH:"%WDK_LIB%\km\i386" ^
          artifacts_x86\dbt_mbr_protector.obj ^
          ntoskrnl.lib hal.lib
        
        if not exist artifacts_x86\dbt_mbr_protector.sys (
          echo ERROR: x86 Linking failed!
          exit /b 1
        )
        
        echo x86 build complete!
        
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dbt-mbr-protector-x86
        path: artifacts_x86\*
        retention-days: 30
