name: Build Template Only (Test)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up MinGW (32-bit)
      uses: egor-tensin/setup-mingw@v3
      with:
        platform: x86

    - name: Compile Template (32-bit)
      shell: cmd
      run: |
        cd template
        i686-w64-mingw32-g++ -static -O0 -mwindows -Wl,--entry=_WinMain@16 locker_payload.cpp -o locker_payload.exe -luser32 -lkernel32 -ladvapi32 -lshlwapi -lntdll
        echo [DEBUG] Compilation finished, checking file...
        dir locker_payload.exe
        if exist locker_payload.exe (
          echo [SUCCESS] locker_payload.exe compiled
        ) else (
          echo [ERROR] Compilation failed!
          exit /b 1
        )

    - name: Upload Template (Test)
      uses: actions/upload-artifact@v4
      with:
        name: TemplateTest
        path: template/locker_payload.exe
        if-no-files-found: error
