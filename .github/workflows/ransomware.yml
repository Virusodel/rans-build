name: Build DBT MBR Protector Driver

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  SOLUTION_PATH: src
  DRIVER_NAME: dbt_mbr_protector

jobs:
  build:
    runs-on: windows-2022
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Visual Studio environment
      uses: microsoft/setup-msbuild@v2
      with:
        vs-version: '17.0'
        
    - name: Install WDK via winget
      shell: pwsh
      run: |
        # Установка WDK через winget (более надежно)
        winget install Microsoft.WindowsDriverKit --accept-package-agreements --accept-source-agreements
        
        # Установка SDK (если не установлен)
        winget install Microsoft.WindowsSDK --accept-package-agreements --accept-source-agreements
        
        # Настройка переменных окружения
        echo "WDKPATH=C:\Program Files (x86)\Windows Kits\10" >> $env:GITHUB_ENV
        echo "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64" >> $env:GITHUB_PATH
        
    - name: Verify WDK installation
      shell: pwsh
      run: |
        # Проверка наличия необходимых инструментов
        Test-Path "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\build.exe"
        Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "build.exe" | Select-Object FullName
        
    - name: Build driver
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
        
        # Создание каталога сборки
        mkdir src\obj 2>nul
        
        # Использование MSBuild вместо build.exe (более современный подход)
        msbuild src\dbt_mbr_protector.vcxproj /p:Configuration=Release /p:Platform=x64 /p:TargetVersion=Windows10
        
    - name: Sign driver (test certificate)
      shell: pwsh
      run: |
        # Создание тестового сертификата
        $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=DBT Test Root" `
          -KeyUsage DigitalSignature -CertStoreLocation Cert:\CurrentUser\My `
          -TextExtension @("2.5.29.19={text}CA=true")
        
        # Поиск скомпилированного драйвера
        $driverPath = Get-ChildItem -Path src -Recurse -Filter "*.sys" | Select-Object -First 1
        
        if ($driverPath) {
          & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe" sign `
            /v /fd SHA256 /a /s My /n "DBT Test Root" `
            /t http://timestamp.digicert.com `
            $driverPath.FullName
          
          # Копирование в финальную директорию
          Copy-Item $driverPath.FullName src\obj\dbt_mbr_protector.sys -Force
        }
        
    - name: Prepare INF file
      shell: pwsh
      run: |
        Copy-Item src\dbt_mbr_protector.inf src\obj\ -Force
        
        # Создание каталога .cat (если необходимо)
        # Для тестовой подписи каталог не обязателен
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dbt-mbr-protector
        path: |
          src\obj\*.sys
          src\obj\*.inf
        retention-days: 30
        
    - name: Create release package
      if: github.ref == 'refs/heads/main'
      shell: pwsh
      run: |
        $version = (Get-Date).ToString('yyyy.MM.dd.HHmm')
        Compress-Archive -Path src\obj\* -DestinationPath "dbt-mbr-protector-$version.zip"
        echo "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
        
    - name: Upload release asset
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: release-package
        path: dbt-mbr-protector-*.zip
