name: Find WDK Paths for x86

on:
  workflow_dispatch:

jobs:
  find-paths:
    runs-on: windows-2022
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Find all WDK library paths
      shell: pwsh
      run: |
        $version = "10.0.26100.0"
        $basePath = "C:\Program Files (x86)\Windows Kits\10\Lib\$version"
        
        Write-Host "========================================="
        Write-Host "SEARCHING FOR WDK LIBRARIES (x86)"
        Write-Host "========================================="
        Write-Host ""
        
        Write-Host "1. Checking if base path exists:"
        if (Test-Path $basePath) {
          Write-Host "   $basePath EXISTS"
        } else {
          Write-Host "   $basePath NOT FOUND"
          Write-Host "   Trying alternative paths..."
          $basePath = "C:\Program Files (x86)\Windows Kits\10\Lib"
          if (Test-Path $basePath) {
            Write-Host "    Using: $basePath"
          } else {
            Write-Host "   No WDK Lib folder found!"
            exit 1
          }
        }
        Write-Host ""
        
        Write-Host "2. Searching for ntoskrnl.lib:"
        $found = Get-ChildItem -Path $basePath -Recurse -Filter "ntoskrnl.lib" -ErrorAction SilentlyContinue
        if ($found) {
          foreach ($f in $found) {
            $size = [math]::Round((Get-Item $f.FullName).Length / 1KB, 2)
            Write-Host "    $($f.FullName) ($size KB)"
          }
        } else {
          Write-Host "   ntoskrnl.lib NOT FOUND ANYWHERE!"
        }
        Write-Host ""
        
        Write-Host "3. Searching for hal.lib:"
        $found = Get-ChildItem -Path $basePath -Recurse -Filter "hal.lib" -ErrorAction SilentlyContinue
        if ($found) {
          foreach ($f in $found) {
            $size = [math]::Round((Get-Item $f.FullName).Length / 1KB, 2)
            Write-Host "   $($f.FullName) ($size KB)"
          }
        } else {
          Write-Host "    hal.lib NOT FOUND ANYWHERE!"
        }
        Write-Host ""
        
        Write-Host "4. Searching for user32.lib:"
        $found = Get-ChildItem -Path $basePath -Recurse -Filter "user32.lib" -ErrorAction SilentlyContinue
        if ($found) {
          foreach ($f in $found) {
            $size = [math]::Round((Get-Item $f.FullName).Length / 1KB, 2)
            Write-Host "   $($f.FullName) ($size KB)"
          }
        } else {
          Write-Host "   user32.lib NOT FOUND ANYWHERE!"
        }
        Write-Host ""
        
        Write-Host "5. Searching for kernel32.lib:"
        $found = Get-ChildItem -Path $basePath -Recurse -Filter "kernel32.lib" -ErrorAction SilentlyContinue
        if ($found) {
          foreach ($f in $found) {
            $size = [math]::Round((Get-Item $f.FullName).Length / 1KB, 2)
            Write-Host "   $($f.FullName) ($size KB)"
          }
        } else {
          Write-Host "    kernel32.lib NOT FOUND ANYWHERE!"
        }
        Write-Host ""
        
        Write-Host "6. Searching for psapi.lib:"
        $found = Get-ChildItem -Path $basePath -Recurse -Filter "psapi.lib" -ErrorAction SilentlyContinue
        if ($found) {
          foreach ($f in $found) {
            $size = [math]::Round((Get-Item $f.FullName).Length / 1KB, 2)
            Write-Host "   $($f.FullName) ($size KB)"
          }
        } else {
          Write-Host "    psapi.lib NOT FOUND ANYWHERE!"
        }
        Write-Host ""
        
        Write-Host "7. Searching for shlwapi.lib:"
        $found = Get-ChildItem -Path $basePath -Recurse -Filter "shlwapi.lib" -ErrorAction SilentlyContinue
        if ($found) {
          foreach ($f in $found) {
            $size = [math]::Round((Get-Item $f.FullName).Length / 1KB, 2)
            Write-Host "    $($f.FullName) ($size KB)"
          }
        } else {
          Write-Host "    shlwapi.lib NOT FOUND ANYWHERE!"
        }
        Write-Host ""
        
        Write-Host "8. Searching for advapi32.lib:"
        $found = Get-ChildItem -Path $basePath -Recurse -Filter "advapi32.lib" -ErrorAction SilentlyContinue
        if ($found) {
          foreach ($f in $found) {
            $size = [math]::Round((Get-Item $f.FullName).Length / 1KB, 2)
            Write-Host "    $($f.FullName) ($size KB)"
          }
        } else {
          Write-Host "    advapi32.lib NOT FOUND ANYWHERE!"
        }
        Write-Host ""
        
        Write-Host "========================================="
        Write-Host "FULL DIRECTORY STRUCTURE (km folder)"
        Write-Host "========================================="
        $kmPath = "$basePath\km"
        if (Test-Path $kmPath) {
          Get-ChildItem $kmPath -Directory | ForEach-Object {
            Write-Host "km\$($_.Name)"
            $libs = Get-ChildItem $_.FullName -Filter "*.lib" -ErrorAction SilentlyContinue
            if ($libs) {
              foreach ($lib in $libs) {
                Write-Host "    $($lib.Name)"
              }
            } else {
              Write-Host "    (empty)"
            }
          }
        } else {
          Write-Host "km folder NOT FOUND!"
        }
        Write-Host ""
        
        Write-Host "========================================="
        Write-Host "FULL DIRECTORY STRUCTURE (um folder)"
        Write-Host "========================================="
        $umPath = "$basePath\um"
        if (Test-Path $umPath) {
          Get-ChildItem $umPath -Directory | ForEach-Object {
            Write-Host " um\$($_.Name)"
            $libs = Get-ChildItem $_.FullName -Filter "*.lib" -ErrorAction SilentlyContinue
            if ($libs) {
              foreach ($lib in $libs) {
                Write-Host "    $($lib.Name)"
              }
            } else {
              Write-Host "    (empty)"
            }
          }
        } else {
          Write-Host " um folder NOT FOUND!"
        }
        Write-Host ""
        
        Write-Host "========================================="
        Write-Host "RECOMMENDED PATHS FOR x86:"
        Write-Host "========================================="
        $ntoskrnl = Get-ChildItem -Path $basePath -Recurse -Filter "ntoskrnl.lib" -ErrorAction SilentlyContinue | Where-Object { $_.Directory.Name -match "i386|x86|32" } | Select-Object -First 1
        if ($ntoskrnl) {
          Write-Host "ntoskrnl.lib: $($ntoskrnl.FullName)"
        } else {
          Write-Host "ntoskrnl.lib: NOT FOUND for x86!"
        }
        
        $hal = Get-ChildItem -Path $basePath -Recurse -Filter "hal.lib" -ErrorAction SilentlyContinue | Where-Object { $_.Directory.Name -match "i386|x86|32" } | Select-Object -First 1
        if ($hal) {
          Write-Host "hal.lib: $($hal.FullName)"
        } else {
          Write-Host "hal.lib: NOT FOUND for x86!"
        }
        
        $user32 = Get-ChildItem -Path $basePath -Recurse -Filter "user32.lib" -ErrorAction SilentlyContinue | Where-Object { $_.Directory.Name -match "i386|x86|32" } | Select-Object -First 1
        if ($user32) {
          Write-Host "user32.lib: $($user32.FullName)"
        } else {
          Write-Host "user32.lib: NOT FOUND for x86!"
        }
        
        $kernel32 = Get-ChildItem -Path $basePath -Recurse -Filter "kernel32.lib" -ErrorAction SilentlyContinue | Where-Object { $_.Directory.Name -match "i386|x86|32" } | Select-Object -First 1
        if ($kernel32) {
          Write-Host "kernel32.lib: $($kernel32.FullName)"
        } else {
          Write-Host "kernel32.lib: NOT FOUND for x86!"
        }
        
        $psapi = Get-ChildItem -Path $basePath -Recurse -Filter "psapi.lib" -ErrorAction SilentlyContinue | Where-Object { $_.Directory.Name -match "i386|x86|32" } | Select-Object -First 1
        if ($psapi) {
          Write-Host "psapi.lib: $($psapi.FullName)"
        } else {
          Write-Host "psapi.lib: NOT FOUND for x86!"
        }
        
        $shlwapi = Get-ChildItem -Path $basePath -Recurse -Filter "shlwapi.lib" -ErrorAction SilentlyContinue | Where-Object { $_.Directory.Name -match "i386|x86|32" } | Select-Object -First 1
        if ($shlwapi) {
          Write-Host "shlwapi.lib: $($shlwapi.FullName)"
        } else {
          Write-Host "shlwapi.lib: NOT FOUND for x86!"
        }
        
        $advapi32 = Get-ChildItem -Path $basePath -Recurse -Filter "advapi32.lib" -ErrorAction SilentlyContinue | Where-Object { $_.Directory.Name -match "i386|x86|32" } | Select-Object -First 1
        if ($advapi32) {
          Write-Host "advapi32.lib: $($advapi32.FullName)"
        } else {
          Write-Host "advapi32.lib: NOT FOUND for x86!"
        }
