name: Build with WDK (Chocolatey)

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-2022
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install WDK via Chocolatey
      shell: pwsh
      run: |
        # Установка Chocolatey (если не установлен)
        if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
          Set-ExecutionPolicy Bypass -Scope Process -Force
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
          iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
        }
        
        # Установка WDK (альтернативный пакет)
        choco install windows-sdk-10-version-2004-windbg -y
        choco install windows-sdk-10-version-2004-build-19041 -y
        
        # Установка MSVC build tools
        choco install visualstudio2022buildtools -y
        choco install visualstudio2022-workload-vctools -y
        
        echo "C:\Program Files (x86)\Windows Kits\10\bin\10.0.19041.0\x64" >> $env:GITHUB_PATH
        
    - name: Build with MSBuild
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
        cd src
        cl /c /Zi /GS- /W4 /O2 /DNDEBUG dbt_mbr_protector.c /Fodbt_mbr_protector.obj /Foobj\
        link /MACHINE:X64 /DRIVER /OUT:obj\dbt_mbr_protector.sys obj\dbt_mbr_protector.obj
        
    - uses: actions/upload-artifact@v4
      with:
        name: driver
        path: src\obj\*.sys
