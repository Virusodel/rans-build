name: Build Kernel Driver with EWDK

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-2022
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Download EWDK ISO
      shell: pwsh
      run: |
        # Прямая ссылка на EWDK (актуальная)
        $url = "https://download.microsoft.com/download/9/4/1/941c1c7a-afae-4932-a5fc-9008caf193d0/EWDK_22621_240228.msi"
        $msiPath = "$env:TEMP\ewdk.msi"
        Invoke-WebRequest -Uri $url -OutFile $msiPath
        
        # Установка
        msiexec /i $msiPath /quiet /qn /norestart INSTALLDIR="C:\EWDK"
        
        echo "C:\EWDK\bin" >> $env:GITHUB_PATH
        
    - name: Build with EWDK
      shell: cmd
      run: |
        call "C:\EWDK\BuildEnv\setenv.bat" /x64 /fre /build
        cd src
        build -cZ
        
    - name: Collect build artifacts
      shell: pwsh
      run: |
        Get-ChildItem -Path src -Recurse -Filter "*.sys" | Copy-Item -Destination src\obj\ -Force
        Get-ChildItem -Path src -Recurse -Filter "*.inf" | Copy-Item -Destination src\obj\ -Force
        
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: driver-kernel
        path: src\obj\*
