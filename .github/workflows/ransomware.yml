name: Build DBT MBR Protector Suite

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Visual Studio
      uses: microsoft/setup-msbuild@v2
      with:
        vs-version: '17.0'
        
    - name: Install Windows SDK
      shell: pwsh
      run: |
        choco install windows-sdk-10-version-2004-windbg -y
        
        $ntddk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -Recurse -Filter "ntddk.h" | Select-Object -First 1
        if ($ntddk) {
          $version = $ntddk.Directory.Parent.Name
          Write-Host "Using WDK Version: $version"
          echo "WDK_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
        } else {
          Write-Host "ntddk.h not found!"
          exit 1
        }
        
    - name: Verify Source Files
      shell: pwsh
      run: |
        $files = @(
          "scr\dbt_mbr_protector.c",
          "scr\dbt_mbr_protector.inf",
          "notifier\dbt_notifier.cpp"
        )
        
        foreach ($file in $files) {
          if (Test-Path $file) {
            Write-Host "$file found"
          } else {
            Write-Host "$file MISSING"
            exit 1
          }
        }
        
    - name: Build x64 Driver + Notifier
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
        
        mkdir artifacts\x64 2>nul
        
        cl /c /Zi /GS- /W4 /O2 /DNDEBUG ^
          /I"C:\Program Files (x86)\Windows Kits\10\Include\%WDK_VERSION%\km" ^
          /I"C:\Program Files (x86)\Windows Kits\10\Include\%WDK_VERSION%\shared" ^
          /I"C:\Program Files (x86)\Windows Kits\10\Include\%WDK_VERSION%\um" ^
          /D_AMD64_ ^
          /D_WIN64 ^
          /D_WIN32_WINNT=0x0601 ^
          /DWINVER=0x0601 ^
          /DNTDDI_VERSION=0x06010000 ^
          scr\dbt_mbr_protector.c ^
          /Foartifacts\x64\dbt_mbr_protector.obj
        
        if not exist artifacts\x64\dbt_mbr_protector.obj (
          echo ERROR: x64 Driver compilation failed!
          exit /b 1
        )
        
        link /MACHINE:X64 /DRIVER /ENTRY:DriverEntry /SUBSYSTEM:NATIVE /OUT:artifacts\x64\dbt_mbr_protector.sys ^
          /LIBPATH:"C:\Program Files (x86)\Windows Kits\10\Lib\%WDK_VERSION%\km\x64" ^
          artifacts\x64\dbt_mbr_protector.obj ^
          ntoskrnl.lib hal.lib
        
        if not exist artifacts\x64\dbt_mbr_protector.sys (
          echo ERROR: x64 Driver linking failed!
          exit /b 1
        )
        
        cl /c /Zi /W4 /O2 /DNDEBUG /EHsc ^
          /I"C:\Program Files (x86)\Windows Kits\10\Include\%WDK_VERSION%\um" ^
          /D_AMD64_ ^
          /D_WIN64 ^
          /D_WIN32_WINNT=0x0601 ^
          /DWINVER=0x0601 ^
          notifier\dbt_notifier.cpp ^
          /Foartifacts\x64\dbt_notifier.obj
        
        if not exist artifacts\x64\dbt_notifier.obj (
          echo ERROR: x64 Notifier compilation failed!
          exit /b 1
        )
        
        link /MACHINE:X64 /OUT:artifacts\x64\dbt_notifier.exe /SUBSYSTEM:WINDOWS ^
          /LIBPATH:"C:\Program Files (x86)\Windows Kits\10\Lib\%WDK_VERSION%\um\x64" ^
          artifacts\x64\dbt_notifier.obj ^
          user32.lib kernel32.lib psapi.lib shlwapi.lib advapi32.lib
        
        if not exist artifacts\x64\dbt_notifier.exe (
          echo ERROR: x64 Notifier linking failed!
          exit /b 1
        )
        
        copy scr\dbt_mbr_protector.inf artifacts\x64\
        echo x64 build complete!
        
    - name: Build x86 Driver + Notifier
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x86
        
        mkdir artifacts\x86 2>nul
        
        cl /c /Zi /GS- /W4 /O2 /DNDEBUG ^
          /I"C:\Program Files (x86)\Windows Kits\10\Include\%WDK_VERSION%\km" ^
          /I"C:\Program Files (x86)\Windows Kits\10\Include\%WDK_VERSION%\shared" ^
          /I"C:\Program Files (x86)\Windows Kits\10\Include\%WDK_VERSION%\um" ^
          /D_X86_ ^
          /D_WIN32 ^
          /D_WIN32_WINNT=0x0601 ^
          /DWINVER=0x0601 ^
          /DNTDDI_VERSION=0x06010000 ^
          /D_CRT_SECURE_NO_WARNINGS ^
          scr\dbt_mbr_protector.c ^
          /Foartifacts\x86\dbt_mbr_protector.obj
        
        if not exist artifacts\x86\dbt_mbr_protector.obj (
          echo ERROR: x86 Driver compilation failed!
          exit /b 1
        )
        
        :: Правильный путь для x86 — i386
        link /MACHINE:X86 /DRIVER /ENTRY:DriverEntry /SUBSYSTEM:NATIVE /OUT:artifacts\x86\dbt_mbr_protector.sys ^
          /LIBPATH:"C:\Program Files (x86)\Windows Kits\10\Lib\%WDK_VERSION%\km\i386" ^
          artifacts\x86\dbt_mbr_protector.obj ^
          ntoskrnl.lib hal.lib
        
        if not exist artifacts\x86\dbt_mbr_protector.sys (
          echo ERROR: x86 Driver linking failed!
          exit /b 1
        )
        
        cl /c /Zi /W4 /O2 /DNDEBUG /EHsc ^
          /I"C:\Program Files (x86)\Windows Kits\10\Include\%WDK_VERSION%\um" ^
          /D_X86_ ^
          /D_WIN32 ^
          /D_WIN32_WINNT=0x0601 ^
          /DWINVER=0x0601 ^
          /D_CRT_SECURE_NO_WARNINGS ^
          notifier\dbt_notifier.cpp ^
          /Foartifacts\x86\dbt_notifier.obj
        
        if not exist artifacts\x86\dbt_notifier.obj (
          echo ERROR: x86 Notifier compilation failed!
          exit /b 1
        )
        
        link /MACHINE:X86 /OUT:artifacts\x86\dbt_notifier.exe /SUBSYSTEM:WINDOWS ^
          /LIBPATH:"C:\Program Files (x86)\Windows Kits\10\Lib\%WDK_VERSION%\um\i386" ^
          artifacts\x86\dbt_notifier.obj ^
          user32.lib kernel32.lib psapi.lib shlwapi.lib advapi32.lib
        
        if not exist artifacts\x86\dbt_notifier.exe (
          echo ERROR: x86 Notifier linking failed!
          exit /b 1
        )
        
        copy scr\dbt_mbr_protector.inf artifacts\x86\
        echo x86 build complete!
        
    - name: Sign All Drivers
      shell: pwsh
      run: |
        $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=DBT Test Root" `
          -KeyUsage DigitalSignature -CertStoreLocation Cert:\CurrentUser\My `
          -TextExtension @("2.5.29.19={text}CA=true")
        
        $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits" -Recurse -Filter "signtool.exe" | Select-Object -First 1
        
        if ($signtool) {
          $archs = @("x64", "x86")
          foreach ($arch in $archs) {
            $sysPath = "artifacts\$arch\dbt_mbr_protector.sys"
            if (Test-Path $sysPath) {
              Write-Host "Signing driver for $arch..."
              & $signtool.FullName sign /v /fd SHA256 /a /s My /n "DBT Test Root" /t http://timestamp.digicert.com $sysPath
            } else {
              Write-Host "WARNING: $sysPath not found!"
            }
          }
        } else {
          Write-Host "WARNING: signtool not found, drivers will be unsigned"
        }
        
    - name: Create Install Scripts
      shell: pwsh
      run: |
        $archs = @("x64", "x86")
        
        foreach ($arch in $archs) {
          $dest = "artifacts\$arch"
          
          $installBat = @"
        @echo off
        title DBT MBR Protector Installer ($arch)
        echo ============================================================
        echo  DBT MBR Protector - Installation ($arch)
        echo ============================================================
        echo.
        
        net session >nul 2>&1
        if %errorLevel% neq 0 (
          echo ERROR: Administrator privileges required!
          echo Please run as Administrator.
          pause
          exit /b 1
        )
        
        echo [1/5] Enabling test signing mode...
        bcdedit /set testsigning on >nul 2>&1
        
        echo [2/5] Copying driver...
        copy /Y dbt_mbr_protector.sys C:\Windows\System32\drivers\
        if %errorLevel% neq 0 (
          echo ERROR: Failed to copy driver!
          pause
          exit /b 1
        )
        
        echo [3/5] Installing service...
        sc create DbtMbrProtector binPath= "C:\Windows\System32\drivers\dbt_mbr_protector.sys" type= kernel start= boot
        
        echo [4/5] Starting driver...
        sc start DbtMbrProtector
        
        echo [5/5] Installing notifier...
        if exist dbt_notifier.exe (
          mkdir "C:\Program Files\DBT" 2>nul
          copy /Y dbt_notifier.exe "C:\Program Files\DBT\"
          start "" "C:\Program Files\DBT\dbt_notifier.exe"
        ) else (
          echo WARNING: Notifier not found, skipping
        )
        
        echo.
        echo ============================================================
        echo  Installation complete for $arch!
        echo ============================================================
        echo.
        echo  Please restart your computer for changes to take effect.
        echo.
        echo  To test: echo test > \\.\PhysicalDrive0
        echo.
        pause
        "@
          $installBat | Out-File -FilePath "$dest\install.bat" -Encoding ASCII
          
          $uninstallBat = @"
        @echo off
        title DBT MBR Protector Uninstaller
        echo ============================================================
        echo  DBT MBR Protector - Uninstallation
        echo ============================================================
        echo.
        
        net session >nul 2>&1
        if %errorLevel% neq 0 (
          echo ERROR: Administrator privileges required!
          echo Please run as Administrator.
          pause
          exit /b 1
        )
        
        echo [1/4] Stopping notifier...
        taskkill /F /IM dbt_notifier.exe 2>nul
        
        echo [2/4] Stopping driver...
        sc stop DbtMbrProtector 2>nul
        
        echo [3/4] Removing service...
        sc delete DbtMbrProtector 2>nul
        
        echo [4/4] Deleting files...
        del /F C:\Windows\System32\drivers\dbt_mbr_protector.sys 2>nul
        rmdir /S /Q "C:\Program Files\DBT" 2>nul
        
        echo.
        echo ============================================================
        echo  Uninstallation complete!
        echo ============================================================
        echo.
        pause
        "@
          $uninstallBat | Out-File -FilePath "$dest\uninstall.bat" -Encoding ASCII
          
          $readme = @"
        DBT MBR PROTECTOR - INSTALLATION GUIDE
        ============================================================
        
        ARCHITECTURE: $arch
        
        FILES:
        ------
        dbt_mbr_protector.sys  : Kernel-mode filter driver ($arch)
        dbt_mbr_protector.inf  : Driver installation file
        dbt_notifier.exe       : User-mode notification service ($arch)
        install.bat            : Automated installation script
        uninstall.bat          : Automated removal script
        
        INSTALLATION:
        -------------
        1. Run install.bat as Administrator
        2. Restart the computer
        3. The protection is now active
        
        TESTING:
        --------
        To verify the driver works:
        - Run as Administrator: echo test > \\.\PhysicalDrive0
        - You should see "Access denied"
        - Notifier will show a warning message
        
        REQUIREMENTS:
        -------------
        - Windows 7/8/10/11 ($arch)
        - Administrator privileges
        - Test signing mode (enabled by installer)
        
        FEATURES:
        --------
        - Protects MBR (sector 0) and GPT headers (sectors 1-9)
        - Kernel-level blocking
        - Process detection
        - Event logging
        
        UNINSTALL:
        ----------
        Run uninstall.bat as Administrator
        "@
          $readme | Out-File -FilePath "$dest\README.txt" -Encoding ASCII
        }
        
        Write-Host "Install scripts created for all architectures"
        
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dbt-mbr-protector-suite
        path: artifacts\*
        retention-days: 30
        
    - name: Create Release Package
      if: github.ref == 'refs/heads/main'
      shell: pwsh
      run: |
        $version = Get-Date -Format "yyyy.MM.dd.HHmm"
        $zipFile = "dbt-mbr-protector-$version.zip"
        Compress-Archive -Path artifacts\* -DestinationPath $zipFile -Force
        echo "ZIP_FILE=$zipFile" | Out-File -FilePath $env:GITHUB_ENV -Append
        
    - name: Upload Release Package
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: release-package
        path: ${{ env.ZIP_FILE }}
