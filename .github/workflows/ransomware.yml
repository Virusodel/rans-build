name: Build DBT MBR Protector Suite

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Visual Studio
      uses: microsoft/setup-msbuild@v2
      with:
        vs-version: '17.0'
        
    - name: Install WDK Components
      shell: pwsh
      run: |
        choco install windows-sdk-10-version-2004-windbg -y
        choco install windows-sdk-10-version-2004-build-19041 -y
        choco install visualstudio2022-workload-vctools -y
        
    - name: Build Kernel Driver
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
        
        mkdir scr\obj 2>nul
        
        :: Компиляция драйвера
        cl /c /Zi /GS- /W4 /O2 /DNDEBUG /I"C:\Program Files (x86)\Windows Kits\10\Include\10.0.19041.0\km" /I"C:\Program Files (x86)\Windows Kits\10\Include\10.0.19041.0\shared" scr\dbt_mbr_protector.c /Foscr\obj\dbt_mbr_protector.obj
        
        :: Линковка драйвера
        link /MACHINE:X64 /DRIVER /OUT:scr\obj\dbt_mbr_protector.sys /LIBPATH:"C:\Program Files (x86)\Windows Kits\10\Lib\10.0.19041.0\km\x64" scr\obj\dbt_mbr_protector.obj ntoskrnl.lib hal.lib
        
        copy scr\dbt_mbr_protector.inf scr\obj\
        
    - name: Build Notifier (User-mode)
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
        
        mkdir notifier\obj 2>nul
        
        :: Компиляция notifier
        cl /c /Zi /W4 /O2 /DNDEBUG notifier\dbt_notifier.cpp /Fonotifier\obj\dbt_notifier.obj
        
        :: Линковка notifier
        link /MACHINE:X64 /OUT:notifier\obj\dbt_notifier.exe /SUBSYSTEM:WINDOWS notifier\obj\dbt_notifier.obj user32.lib kernel32.lib psapi.lib advapi32.lib
        
    - name: Sign Driver (Test Certificate)
      shell: pwsh
      run: |
        $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=DBT Test Root" `
          -KeyUsage DigitalSignature -CertStoreLocation Cert:\CurrentUser\My `
          -TextExtension @("2.5.29.19={text}CA=true")
        
        $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits" -Recurse -Filter "signtool.exe" | Select-Object -First 1
        
        if ($signtool -and (Test-Path "scr\obj\dbt_mbr_protector.sys")) {
          & $signtool.FullName sign /v /fd SHA256 /a /s My /n "DBT Test Root" /t http://timestamp.digicert.com scr\obj\dbt_mbr_protector.sys
        }
        
    - name: Create Installation Package
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path artifacts
        
        # Копирование драйвера
        Copy-Item scr\obj\dbt_mbr_protector.sys artifacts\
        Copy-Item scr\obj\dbt_mbr_protector.inf artifacts\
        Copy-Item scr\obj\dbt_mbr_protector.pdb artifacts\
        
        # Копирование notifier
        Copy-Item notifier\obj\dbt_notifier.exe artifacts\
        
        # Создание установочного скрипта
        @"
        @echo off
        echo Installing DBT MBR Protector...
        
        :: Копирование драйвера
        copy /Y dbt_mbr_protector.sys C:\Windows\System32\drivers\
        
        :: Установка сервиса драйвера
        sc create DbtMbrProtector binPath= "C:\Windows\System32\drivers\dbt_mbr_protector.sys" type= kernel start= boot
        
        :: Запуск драйвера
        sc start DbtMbrProtector
        
        :: Установка notifier
        mkdir "C:\Program Files\DBT" 2>nul
        copy /Y dbt_notifier.exe "C:\Program Files\DBT\"
        
        :: Запуск notifier
        start "" "C:\Program Files\DBT\dbt_notifier.exe"
        
        echo Installation complete!
        pause
        "@ | Out-File -FilePath artifacts\install.bat -Encoding ASCII
        
        # Создание скрипта удаления
        @"
        @echo off
        echo Uninstalling DBT MBR Protector...
        
        taskkill /F /IM dbt_notifier.exe 2>nul
        
        sc stop DbtMbrProtector
        sc delete DbtMbrProtector
        
        del /F C:\Windows\System32\drivers\dbt_mbr_protector.sys 2>nul
        rmdir /S /Q "C:\Program Files\DBT" 2>nul
        
        echo Uninstallation complete!
        pause
        "@ | Out-File -FilePath artifacts\uninstall.bat -Encoding ASCII
        
        # Создание README
        @"
        DBT MBR Protector - Installation Guide
        ======================================
        
        Files:
        - dbt_mbr_protector.sys  : Kernel driver
        - dbt_mbr_protector.inf  : Driver installation file
        - dbt_notifier.exe       : User-mode notification service
        - install.bat            : Installation script
        - uninstall.bat          : Uninstallation script
        
        Installation:
        1. Run install.bat as Administrator
        2. Reboot (optional, but recommended)
        
        Testing:
        - Try writing to \\.\PhysicalDrive0
        - Notifier will show a MessageBox on MBR write attempt
        - Check Windows Event Viewer for logs
        
        Requirements:
        - Windows 7/8/10/11 (x64)
        - Administrator privileges
        - Test signing mode enabled: bcdedit /set testsigning on
        "@ | Out-File -FilePath artifacts\README.txt -Encoding ASCII
        
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dbt-mbr-protector-suite
        path: artifacts\*
        retention-days: 30
        
    - name: Create Release Package
      if: github.ref == 'refs/heads/main'
      shell: pwsh
      run: |
        $version = (Get-Date).ToString('yyyy.MM.dd.HHmm')
        Compress-Archive -Path artifacts\* -DestinationPath "dbt-mbr-protector-$version.zip"
        
    - name: Upload Release Package
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: release-package
        path: dbt-mbr-protector-*.zip
